on:
  push:
    tags:
      - "v*"

name: Release

permissions:
  contents: read

jobs:
  build_release_tarballs:
    name: Build release tarball (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Build release tarball
        run: |
          nix build .#packages.${{ matrix.system }}.release-tarball -Lv --out-link result-release-tarball
          mkdir -p dist
          cp result-release-tarball/*.tar.gz result-release-tarball/*.tar.gz.sha512 dist/
      - name: Upload release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball-${{ matrix.system }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha512
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build_release_tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-tarball-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          files: |
            dist/rsync-sjtug-*.tar.gz
            dist/rsync-sjtug-*.tar.gz.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_image:
    name: Release Postgres image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push postgres image
        run: |
          nix run .#postgres-image.copyToDockerDaemon -Lv
          docker push photonquantum/postgres-rsync-sjtug:latest
