on:
  push:
    tags:
      - "v*"

name: Release

permissions:
  contents: read

jobs:
  release:
    name: Release static binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Build static binaries
        run: |
          nix build .#rsync-fetcher_musl -Lv --out-link result-rsync-fetcher
          nix build .#rsync-gateway_musl -Lv --out-link result-rsync-gateway
          nix build .#rsync-gc_musl -Lv --out-link result-rsync-gc
      - name: Create archive
        run: |
          archive=rsync-sjtug-x86_64-unknown-linux-musl
          mkdir -p "dist/$archive/bin"
          cp result-rsync-fetcher/bin/rsync-fetcher "dist/$archive/bin/"
          cp result-rsync-gateway/bin/rsync-gateway "dist/$archive/bin/"
          cp result-rsync-gc/bin/rsync-gc "dist/$archive/bin/"
          tar -C dist -czf "$archive.tar.gz" "$archive"
          sha512sum "$archive.tar.gz" > "$archive.tar.gz.sha512"
      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          files: |
            rsync-sjtug-x86_64-unknown-linux-musl.tar.gz
            rsync-sjtug-x86_64-unknown-linux-musl.tar.gz.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_image:
    name: Release Postgres image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push postgres image
        run: |
          nix run .#postgres-image.copyToDockerDaemon -Lv
          docker push photonquantum/postgres-rsync-sjtug:latest
